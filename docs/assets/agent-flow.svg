    <circle cx="359" cy="207" r="23" fill="#69836A"/><text x="359" y="214" text-anchor="middle" fill="#F9F8F1" font-family="Arial,sans-serif" font-size="16">◎</text>
    <text x="359" y="255" text-anchor="middle" fill="#F9F8F1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Orchestrator</text>
    <text x="359" y="277" text-anchor="middle" fill="#DBE3D8" font-family="Arial,sans-serif" font-size="10">Plans roles + dependencies</text>
    <text x="359" y="293" text-anchor="middle" fill="#DBE3D8" font-family="Arial,sans-serif" font-size="10">Correlated execution trace</text>

