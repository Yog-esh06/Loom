<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none">
  <defs>
    <linearGradient id="bg" x1="95" y1="30" x2="1110" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#F8F7F1"/><stop offset="1" stop-color="#E9EEE7"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#81917A"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3C463B" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>
  <text x="54" y="62" fill="#85877D" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">A HUMAN-GOVERNED MULTI-AGENT RUN</text>
  <text x="54" y="102" fill="#292B25" font-family="Georgia,serif" font-size="30">A suggestion is not an action.</text>
