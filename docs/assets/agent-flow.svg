  <rect x="273" y="359" width="362" height="64" rx="11" fill="#E5EAE1" stroke="#D5DED1"/>
  <text x="297" y="386" fill="#71816A" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">STRUCTURED HAND-OFF</text>
  <text x="297" y="406" fill="#485244" font-family="Arial,sans-serif" font-size="12" font-weight="700">Correlation ID · role · message type · validated payload</text>
