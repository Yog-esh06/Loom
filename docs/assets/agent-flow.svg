    <circle cx="586" cy="207" r="23" fill="#F1EBDF"/><text x="586" y="213" text-anchor="middle" fill="#A18256" font-family="Arial,sans-serif" font-size="15">¶</text>
    <text x="586" y="255" text-anchor="middle" fill="#3E4139" font-family="Arial,sans-serif" font-size="13" font-weight="700">Document agent</text>
    <text x="586" y="277" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">Finds source-backed actions</text>
    <text x="586" y="293" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">and returns evidence</text>

    <rect x="726" y="160" width="174" height="152" rx="13" fill="#FFFEFA" stroke="#DFE1D9"/>
    <circle cx="813" cy="207" r="23" fill="#E8EDF0"/><text x="813" y="214" text-anchor="middle" fill="#728695" font-family="Arial,sans-serif" font-size="15">↗</text>
    <text x="813" y="255" text-anchor="middle" fill="#3E4139" font-family="Arial,sans-serif" font-size="13" font-weight="700">Task planner</text>
    <text x="813" y="277" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">Builds structured proposals</text>
    <text x="813" y="293" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">No silent task writes</text>

    <rect x="953" y="160" width="196" height="152" rx="13" fill="#FFFEFA" stroke="#DFE1D9"/>
    <circle cx="1051" cy="207" r="23" fill="#F0E7E5"/><text x="1051" y="214" text-anchor="middle" fill="#9A756A" font-family="Arial,sans-serif" font-size="14">✓</text>
    <text x="1051" y="255" text-anchor="middle" fill="#3E4139" font-family="Arial,sans-serif" font-size="13" font-weight="700">Quality verifier</text>
    <text x="1051" y="277" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">Checks shape + source</text>
    <text x="1051" y="293" text-anchor="middle" fill="#8B8C83" font-family="Arial,sans-serif" font-size="10">before human review</text>
  </g>
  <path d="M218 236H262" stroke="#81917A" stroke-width="2.5" marker-end="url(#arrow)"/>
